name: online_cinema_prod

services:
  postgres:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - online_cinema_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  migrator:
    build:
      context: .
      dockerfile: Dockerfile.prod

    command: alembic upgrade head

    env_file:
      - .env.prod

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

    depends_on:
      postgres:
        condition: service_healthy


  api:
    build:
      context: .
      dockerfile: Dockerfile.prod

    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      CELERY_BROKER_URL: redis://redis:6379/0

    ports:
      - "8000:8000"

    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy


  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.prod

    restart: unless-stopped

    command: >
      celery
      -A app.core.celery_app:celery_app
      worker
      --loglevel=INFO

    env_file:
      - .env.prod

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0

    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy


  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.prod

    restart: unless-stopped

    command: >
      celery
      -A app.core.celery_app:celery_app
      beat
      --loglevel=INFO
      --schedule=/tmp/celerybeat-schedule

    env_file:
      - .env.prod

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0

    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy


volumes:
  online_cinema_postgres_data:
    name: online_cinema_prod_online_cinema_postgres_data
