services:
  postgres:
    image: postgres:18
    container_name: online_cinema_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - online_cinema_postgres_data:/var/lib/postgresql


volumes:
  online_cinema_postgres_data:
