[project]
name = "online-cinema"
version = "0.1.0"
description = "FastAPI-based online cinema service with user management, movie catalog, orders, and payments."
authors = [
    {name = "Illia Dubina",email = "armahanz.music@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.2,<0.53.0)",
    "sqlalchemy[asyncio] (>=2.0.52,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "aiosmtplib (>=5.1.2,<6.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "celery[redis] (>=5.6.3,<6.0.0)",
    "stripe (>=15.5.0,<16.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "aioboto3 (>=15.5.0,<16.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "black[d] (>=26.5.1,<27.0.0)"
]

[tool.poetry]
package-mode = false
